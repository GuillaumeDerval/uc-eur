[project]
name = "pypsa-uc-gen"
version = "1.0.0"
description = "Generate UnitCommitment.jl benchmark instances from PyPSA open data"
requires-python = ">=3.10"
dependencies = [
    "pypsa>=0.28",
    "powerplantmatching>=0.5",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["pypsa_uc_gen"]
py-modules = ["generate", "generate_batch"]
